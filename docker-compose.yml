services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    command: uv run uvicorn app.backend.main:app --host 0.0.0.0 --port 8000
  ui:
    build: .
    env_file: .env
    environment:
      API_URL: http://localhost:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: uv run streamlit run app/frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true

